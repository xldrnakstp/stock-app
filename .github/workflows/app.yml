name: Stock app

on:
  schedule:
    - cron: "0 22 * * 0-4"   # 한국시간 평일 07:00 — 전체 분석 (미국장 마감 반영)
    - cron: "10 7 * * 1-5"   # 한국시간 평일 16:10 — 보유 종목 점검 (한국장 마감 반영)
  workflow_dispatch:          # 앱의 '지금 분석' 버튼 / Actions 탭에서 수동 실행
    inputs:
      mode:
        description: "full = 전체 분석, holdings = 보유 종목만"
        type: choice
        options: [full, holdings]
        default: full
  push:
    paths: ["trades.enc", "subs.enc"]   # 앱에서 매수·매도 입력, 알림 켜기

permissions:
  contents: write

concurrency:
  group: stock-app
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Analyze
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event_name == 'schedule' && github.event.schedule == '0 22 * * 0-4') && 'full' || 'holdings' }}
        run: python app_build.py --mode "$MODE"

      - name: Save (encrypted)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- docs cache vapid.enc
          git add -A -- subs.enc 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "앱 데이터 업데이트 $(TZ=Asia/Seoul date '+%F %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
